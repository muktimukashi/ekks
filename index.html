<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>EKKS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body{
    margin:0;
    font-family:'Poppins',sans-serif;
    height:100vh;
    background:#eef2ff;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ==========================================
     PAGE WRAPPER (show/hide)
  ========================================== */
  .page{
    flex:1;
    width:100%;
    height:100%;
    overflow:auto;
    display:none;
  }
  .page.active{
    display:block;
  }

  /* ==========================================
     HOME PAGE DESIGN
  ========================================== */
  .home-bg{
    width:100%;
    height:100%;
    background:
      linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
      url("bg.jpg");
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }

  .home-box{
    text-align:center;
    color:white;
    max-width:700px;
    padding:20px;
  }

  .welcome-photo{
    width:150px;
    height:150px;
    border-radius:50%;
    overflow:hidden;
    margin:0 auto 16px auto;
    border:4px solid white;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
  }
  .welcome-photo img{
    object-fit:cover;
    width:100%;
    height:100%;
    display:block;
  }

  #typing{
    font-size:2rem;
    font-weight:700;
    border-right:3px solid white;
    padding-right:6px;
    white-space:nowrap;
    overflow:hidden;
    animation:blink .6s infinite alternate;
  }

  @keyframes blink{
    0%{border-color:rgba(255,255,255,1);}
    100%{border-color:rgba(255,255,255,0);}
  }

  .home-box p{
    margin-top:10px;
    font-size:1rem;
    opacity:.94;
    line-height:1.6;
  }

  /* ==========================================
     MENU
  ========================================== */
  .menu-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:10px;
    padding:12px;
    background:white;
    border-top:1px solid #ddd;
    overflow-x:auto;
    z-index:2000;
  }

  .menu-item{
    padding:10px 16px;
    border:2px solid #bbb;
    border-radius:12px;
    background:white;
    cursor:pointer;
    font-size:.9rem;
    font-weight:500;
    white-space:nowrap;
    transition:.18s;
  }
  .menu-item:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 14px rgba(0,0,0,.15);
  }
  .menu-item.active{
    border-color:#4b73ff;
    background:#e8efff;
    color:#4b73ff;
    transform:translateY(-4px);
    box-shadow:0 8px 14px rgba(0,0,0,.15);
  }

  /* ==========================================
     EMBED PAGES
  ========================================== */
  .embedbox{
    padding:12px;
  }
  iframe{
    width:100%;
    height:calc(100vh - 110px);
    border:none;
    border-radius:14px;
  }

  /* ==========================================
     RESPONSIVE MODE HP
  ========================================== */
  @media (max-width:600px){
    .welcome-photo{
      width:120px;
      height:120px;
    }
    #typing{
      font-size:1.4rem;
    }
    .home-box p{
      font-size:.85rem;
    }
    .menu-item{
      padding:6px 12px;
      font-size:.8rem;
      border-radius:10px;
    }
    iframe{
      height:calc(100vh - 130px);
    }
  }
</style>
</head>

<body>

<!-- ====================== HOME ====================== -->
<div id="home" class="page active">
  <div class="home-bg">
    <div class="home-box">

      <!-- FOTO (boleh ganti foto ibu / logo sekolah) -->
      <div class="welcome-photo">
        <img src="guru.jpg" alt="Foto Ibu Yustina">
      </div>

      <h2 id="typing"></h2>

      <p>
        Evaluasi Kinerja Kepala Sekolah (manajerial, supervisi, kemitraan, dan kewirausahaan).<br>
        Tahun Ajaran 2025/2026. SD Semut-Semut the Natural School.<br>
        <br>
      </p>

    </div>
  </div>
</div>

<!-- ===================== PAGE 1 ===================== -->
<div id="m1" class="page">
  <div class="embedbox">
    <iframe src="https://www.canva.com/design/DAG5ztnghsM/77JsyklClNF6-VrNosrT8w/view?embed"></iframe>
  </div>
</div>

<!-- ===================== PAGE 2 ===================== -->
<div id="m2" class="page">
  <div class="embedbox">
    <iframe src="https://www.canva.com/design/DAG6R-t068I/RtTemAldUg320D-JLWRYxA/view?embed"></iframe>
  </div>
</div>

<!-- ===================== PAGE 3 ===================== -->
<div id="m3" class="page">
  <div class="embedbox">
    <iframe src="https://www.canva.com/design/DAG526IRPvk/vZyIhIOCSLvqlSOqoWLcqg/view?embed"></iframe>
  </div>
</div>

<!-- ===================== PAGE 4 ===================== -->
<div id="m4" class="page">
  <div class="embedbox">
    <iframe src="https://www.canva.com/design/DAG6WK6oD8E/yam7roGBwkq5pS5U9kkZVA/view?embed"></iframe>
  </div>
</div>

<!-- ===================== MENU ===================== -->
<div class="menu-bar">
  <div class="menu-item active" data="home">Home</div>
  <div class="menu-item" data="m1">Manajerial</div>
  <div class="menu-item" data="m2">Supervisi</div>
  <div class="menu-item" data="m3">Kemitraan</div>
  <div class="menu-item" data="m4">Kewirausahaan</div>
</div>

<script>
/* ================= TYPEWRITER ================= */
const msg = "Selamat datang, Ibu Yustina, S.Pd, M.M.";
let pos = 0;
function type(){
  const el = document.getElementById("typing");
  if(pos < msg.length){
    el.innerHTML += msg.charAt(pos);
    pos++;
    setTimeout(type, 65);
  } else {
    el.innerHTML += " ";
  }
}
type();

/* ================= NAVIGATION ================= */
const pages = document.querySelectorAll(".page");
document.querySelectorAll(".menu-item").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll(".menu-item").forEach(m=>m.classList.remove("active"));
    btn.classList.add("active");

    pages.forEach(p=>p.classList.remove("active"));
    document.getElementById(btn.getAttribute("data")).classList.add("active");
  }
});
</script>

</body>
</html>
