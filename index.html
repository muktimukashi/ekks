<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>EKKS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#eef2ff;
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* AREA KONTEN */
  #content{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    overflow:hidden;
    padding-bottom:90px; /* agar tidak ketutup menu */
  }

  /* BACKGROUND HOME */
  .home-bg{
    width:100%;
    height:100%;
    background:
      linear-gradient( rgba(0,0,0,.55), rgba(0,0,0,.55) ),
      url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=1600&auto=format');
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .home-box{
    text-align:center;
    color:white;
    padding:30px;
    max-width:750px;
  }
  .home-box h1{
    font-size:2.35rem;
    font-weight:700;
    margin-bottom:8px;
  }
  .home-box p{
    font-size:1.05rem;
    opacity:.93;
  }

  /* MENU BAWAH */
  .menu-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:10px;
    padding:12px;
    border-top:1px solid #ddd;
    background:white;
    z-index:99999;
  }

  .menu-item{
    padding:8px 14px;
    border:2px solid #c9c9c9;
    border-radius:10px;
    background:white;
    cursor:pointer;
    font-size:.95rem;
    font-weight:500;
    transition:.18s;
  }

  .menu-item:hover{
    background:#f5f5f5;
    transform:translateY(-2px);
  }

  .menu-item.active{
    border-color:#4f7cff;
    color:#4f7cff;
    background:#ebf1ff;
    font-weight:600;
  }

  /* EMBED WRAPPER */
  .embed-wrapper{
    width:100%;
    height:100%;
    padding:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
  }

  iframe{
    border:none;
    width:100%;
    height:100%;
    border-radius:12px;
  }
</style>
</head>
<body>

<div id="content">
  <!-- HALAMAN HOME -->
  <div class="home-bg">
    <div class="home-box">
      <h1>Selamat Datang, Ibu Yustina 👩‍🏫</h1>
      <p>di SD Semut-Semut the Natural School.<br>Penilai EKKS Tahun 2025.</p>
    </div>
  </div>
</div>

<!-- MENU BAWAH -->
<div class="menu-bar">
  <div class="menu-item active" data-page="home" onclick="go('home')">Home</div>
  <div class="menu-item" data-page="m1" onclick="go('m1')">Manajerial</div>
  <div class="menu-item" data-page="m2" onclick="go('m2')">Supervisi</div>
  <div class="menu-item" data-page="m3" onclick="go('m3')">Kemitraan</div>
  <div class="menu-item" data-page="m4" onclick="go('m4')">Kewirausahaan</div>
</div>

<script>
function go(page){
  document.querySelectorAll(".menu-item").forEach(btn=>{
    btn.classList.remove("active")
  })
  document.querySelector('.menu-item[data-page="'+page+'"]').classList.add("active")

  const area=document.getElementById("content")

  /* HOME */
  if(page==="home"){
    area.innerHTML=`
      <div class="home-bg">
        <div class="home-box">
          <h1>Selamat Datang, Ibu Yustina 👩‍🏫</h1>
          <p>Dashboard pembelajaran, supervisi, kemitraan, dan kewirausahaan sekolah.<br>Silakan pilih menu di bawah.</p>
        </div>
      </div>
    `
  }

  /* MANAJERIAL */
  if(page==="m1"){
    area.innerHTML=`
      <div class="embed-wrapper">
        <div style="position:relative;width:100%;height:0;padding-top:56.25%;
          box-shadow:0 2px 8px rgba(63,69,81,.16);
          overflow:hidden;border-radius:8px;margin-top:1em;">
          <iframe loading="lazy"
            style="position:absolute;width:100%;height:100%;top:0;left:0;border:0;"
            src="https://www.canva.com/design/DAG5ztnghsM/77JsyklClNF6-VrNosrT8w/view?embed"
            allowfullscreen>
          </iframe>
        </div>
      </div>
    `
  }

  /* SUPERVISI — kamu baru kirim link ini */
  if(page==="m2"){
    area.innerHTML=`
      <div class="embed-wrapper">
        <div style="position:relative;width:100%;height:0;padding-top:56.25%;
          box-shadow:0 2px 8px rgba(63,69,81,.16);
          overflow:hidden;border-radius:8px;margin-top:1em;">
          <iframe loading="lazy"
            style="position:absolute;width:100%;height:100%;top:0;left:0;border:0;"
            src="https://www.canva.com/design/DAG6R-t068I/RtTemAldUg320D-JLWRYxA/view?embed"
            allowfullscreen>
          </iframe>
        </div>
      </div>
    `
  }

  /* KEMITRAAN */
  if(page==="m3"){
    area.innerHTML=`
      <div class="embed-wrapper">
        <div style="position:relative;width:100%;height:0;padding-top:56.25%;
          box-shadow:0 2px 8px rgba(63,69,81,.16);
          overflow:hidden;border-radius:8px;margin-top:1em;">
          <iframe loading="lazy"
            style="position:absolute;width:100%;height:100%;top:0;left:0;border:0;"
            src="https://www.canva.com/design/DAG526IRPvk/vZyIhIOCSLvqlSOqoWLcqg/view?embed"
            allowfullscreen>
          </iframe>
        </div>
      </div>
    `
  }

  /* KEWIRAUSAHAAN */
  if(page==="m4"){
    area.innerHTML=`
      <div class="embed-wrapper">
        <div style="position:relative;width:100%;height:0;padding-top:56.25%;
          box-shadow:0 2px 8px rgba(63,69,81,.16);
          overflow:hidden;border-radius:8px;margin-top:1em;">
          <iframe loading="lazy"
            style="position:absolute;width:100%;height:100%;top:0;left:0;border:0;"
            src="https://www.canva.com/design/DAG6WK6oD8E/yam7roGBwkq5pS5U9kkZVA/view?embed"
            allowfullscreen>
          </iframe>
        </div>
      </div>
    `
  }
}
</script>

</body>
</html>
